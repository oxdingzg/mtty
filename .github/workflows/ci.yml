name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Full three-OS test matrix once a night (and on demand).
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Run all code checks regardless of changed paths"
        type: boolean
        default: true

# Rapid pushes to the same branch cancel the previous run instead of queueing.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide whether anything but docs changed, so docs-only pushes stay fast
  # (they still run `privacy`).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      code: ${{ steps.diff.outputs.code }}
      dependencies: ${{ steps.diff.outputs.dependencies }}
      render: ${{ steps.diff.outputs.render }}
      perf: ${{ steps.diff.outputs.perf }}
      packaging: ${{ steps.diff.outputs.packaging }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check change classification
        run: python3 scripts/test-ci-changes.py
      - id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL: ${{ inputs.full }}
        run: python3 scripts/ci-changes.py >> "$GITHUB_OUTPUT"

  # Formatting and clippy. AGENTS.md makes these gates, so CI enforces them.
  lint:
    needs: changes
    if: needs.changes.outputs.perf == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Dependency policy (ADR 0006): permissive licences only, no copyleft inside
  # the engine, and no advisories beyond the ones deny.toml argues for. It reads
  # Cargo.lock and registry metadata, so it compiles nothing and takes seconds.
  deny:
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # -W unmaintained is a flag of the `check` subcommand, hence
      # command-arguments. It keeps the unmaintained advisories printed on every
      # run without failing the build; a newly disclosed vulnerability still
      # fails it, which is the whole point.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: ""
          command-arguments: "-W unmaintained"

  # Test the merged main tree as well as each PR.
  test-linux:
    needs: changes
    if: needs.changes.outputs.perf == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-fail-fast

  # macOS: compile-check on pushes, full tests on PRs/nightly/manual.
  macos:
    needs: changes
    if: needs.changes.outputs.perf == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        if: github.event_name != 'push'
        run: cargo test --workspace --no-fail-fast
      - name: Check (compile only)
        if: github.event_name == 'push'
        run: cargo check --workspace

  # Windows is the slow runner (link/IO), so it is kept off the push path.
  windows:
    needs: changes
    if: needs.changes.outputs.perf == 'true' && github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-fail-fast

  render-linux:
    needs: changes
    if: needs.changes.outputs.render == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Real Linux wgpu coverage (ADR 0030) without a GPU: install Mesa's
      # software Vulkan (lavapipe) and require the headless smoke test to run.
      - name: Install software Vulkan (lavapipe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1
      - name: Headless render smoke (lavapipe)
        env:
          MIAO_REQUIRE_GPU: "1"
          WGPU_BACKEND: vulkan
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: cargo test -p mtty-render -- --nocapture

  # Release + LTO build; run it on PRs/nightly/manual, not on every push.
  perf:
    needs: changes
    if: needs.changes.outputs.perf == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The nightly/manual run refreshes the baseline through a pull request,
    # since main only accepts changes that way.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      # Looser than the local 25% so shared-runner noise does not flake.
      PERF_REGRESSION_PCT: "40"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Performance gate (ADR 0018/0028): release-mode budgets plus a comparison
      # against the durable baseline committed at benches/perf-baseline.json.
      - run: cargo test --release -p mtty-core -p mtty-graphics -p mtty-editor -p mtty-widget -p mtty-ptyhost -p mtty-app -- --ignored
      - name: Compare against the committed baseline
        run: python3 scripts/check-perf-baseline.py
      - name: Preserve performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-measurements
          path: |
            target/perf-measured.json
            target/perf-hosted-output-samples.json
      - name: Refresh the baseline (main, nightly / manual)
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ ! -f target/perf-measured.json ]; then
            echo "no measurements; leaving the baseline alone"
            exit 0
          fi
          cp target/perf-measured.json benches/perf-baseline.json
          if git diff --quiet -- benches/perf-baseline.json; then
            echo "baseline unchanged"
            exit 0
          fi
          # A newer measurement supersedes any open baseline PR; without this
          # every schedule run leaves another branch behind.
          for old in $(gh pr list --base main --json headRefName,number \
              -q '.[] | select(.headRefName | startswith("chore/perf-baseline-")) | .number'); do
            gh pr close "$old" --comment "Superseded by a newer schedule run." --delete-branch
          done
          # main is protected: a direct push is rejected ("Changes must be made
          # through a pull request"), so land the refresh through a PR instead.
          branch="chore/perf-baseline-${GITHUB_RUN_ID}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add benches/perf-baseline.json
          git commit -m "chore(perf): refresh the CI baseline from the ${{ github.event_name }} run"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(perf): refresh the CI baseline" \
            --body "Automated baseline refresh from the ${{ github.event_name }} run (${GITHUB_RUN_ID})."
          # GITHUB_TOKEN-created PRs do not trigger pull_request workflows.
          # Explicit dispatch does, and the required gate prevents an unchecked merge.
          gh workflow run ci.yml --ref "$branch"
          pr_number="$(gh pr view "$branch" --json number -q .number)"
          gh pr merge "$pr_number" --squash --auto --delete-branch

  packaging:
    needs: changes
    if: needs.changes.outputs.packaging == 'true' && github.event_name != 'push'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      actions: read
    secrets: inherit

  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Fail if the tree leaks machine-specific details or secrets (AGENTS.md).
      # Add your own identifiers (host aliases, usernames, internal hostnames)
      # to the repository secret PRIVACY_DENYLIST, one per line.
      - name: Machine-specific / secret scan
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: sh scripts/check-privacy.sh
      # Release bodies are English and link to the docs/releases/<tag>.zh-CN.md
      # mirror; keep docs/releases/ and scripts/release-notes.py consistent.
      - name: Release-notes language rule
        run: python3 scripts/test-release-notes.py
      - name: Gate policy regression checks
        run: python3 scripts/test-ci-gate.py
      - name: Release CI policy
        run: python3 scripts/test_release_ci.py
      - name: Validate workflow syntax
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck=''
      # The Windows icon resource check only runs on the packaging runner, so
      # its platform-independent format checks run here on every pull request.
      - name: Windows icon resource format
        run: python3 scripts/check-windows-icon.py assets/icons/mtty.ico

  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, lint, deny, test-linux, macos, windows, render-linux, perf, privacy, packaging]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Enforce required checks and explicit skips
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci-gate.py
