[package]
name = "mtty-ui"
description = "Host-agnostic pieces shared by the mtty hosts: theme, input encoding, selection, row building, split layout, and egui chrome widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
mtty-core = { path = "../mtty-core" }
mtty-render = { path = "../mtty-render" }
mtty-config = { path = "../mtty-config" }
mtty-mtp = { path = "../mtty-mtp" }
mtty-platform = { path = "../mtty-platform" }
egui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
minisign-verify = "0.3.0"
unicode-width = "0.2"
# Serial consoles (BSD-2-Clause OR Apache-2.0). ADR 0037. Ports are opened by
# path, and the list falls back to a /dev scan where the crate cannot enumerate.
# serial2, not serialport: the latter is MPL-2.0, which ADR 0006 excludes.
serial2 = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
# System-wide Quick Terminal hotkey (MIT). See ADR 0019.
global-hotkey = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
# Wayland/X11 global shortcut through the XDG desktop portal (MIT). See ADR 0026.
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }
tokio = { version = "1", default-features = false, features = ["rt"] }
