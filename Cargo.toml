[workspace]
resolver = "2"
members = ["crates/*", "mtty-app", "mtty-cli"]

[workspace.package]
version = "0.2.5"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/oxdingzg/mtty"
homepage = "https://mtty.dev/mtty"
authors = ["mtty contributors"]

[profile.release]
lto = "thin"
codegen-units = 1

# egui/wgpu/glyphon are unusably slow unoptimized and dominate frame time, so
# optimize dependencies even in dev builds (our own crate stays debuggable).
[profile.dev.package."*"]
opt-level = 3

# muda 0.15.3 aborts (an `unwrap` inside an AppKit callback that cannot unwind)
# when an icon has no pixels, which is what clicking the standard About item hits
# for a process without an application icon. See vendor/muda/PATCHES.miao.md.
[patch.crates-io]
muda = { path = "vendor/muda" }
egui_commonmark = { path = "vendor/egui_commonmark" }
winit = { path = "vendor/winit" }
